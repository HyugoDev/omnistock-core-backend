# ==========================================
# 1. IDENTIFICACION Y SERVIDOR
# ==========================================
spring.application.name=omnistock-core-backend
server.port=${SERVER_PORT:8080}

# ==========================================
# 2. BASE DE DATOS (POSTGRESQL 16)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omnistock_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:omnistock_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:omnistock_secret_2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 4. LOGS Y FORMATO
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.com.inventario=DEBUG
